<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>24 小時報時制・小三互動練習（重製版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EEF3F8; --surface:#FFFFFF; --ink:#172338; --muted:#5A6A80; --line:#D3DDE9;
  --board:#1B3354; --amber:#FFB81C; --am:#2F7FD1; --pm:#D9622B;
  --ok:#17905F; --okbg:#E3F5EC; --bad:#C93C3C; --badbg:#FBE7E7; --warn:#A86A00; --warnbg:#FFF3D6;
  --secA:#2F7FD1; --secB:#7652C7; --secC:#17905F; --secD:#C93C3C; --secL:#1B3354;
  --hint:#FFF8E6; --hintline:#F0D48A; --sel:#E2ECF8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1725; --surface:#172338; --ink:#E7EDF6; --muted:#9AAAC0; --line:#2B3B55;
    --board:#0A1424; --amber:#FFC23D; --am:#6AAEF0; --pm:#F08A55;
    --ok:#45C38C; --okbg:#143628; --bad:#F07272; --badbg:#3A1C20; --warn:#F2C155; --warnbg:#3A2E12;
    --secA:#6AAEF0; --secB:#A98AF0; --secC:#45C38C; --secD:#F07272; --secL:#9AB6E0;
    --hint:#2A2614; --hintline:#6B5A23; --sel:#203252;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1725; --surface:#172338; --ink:#E7EDF6; --muted:#9AAAC0; --line:#2B3B55;
  --board:#0A1424; --amber:#FFC23D; --am:#6AAEF0; --pm:#F08A55;
  --ok:#45C38C; --okbg:#143628; --bad:#F07272; --badbg:#3A1C20; --warn:#F2C155; --warnbg:#3A2E12;
  --secA:#6AAEF0; --secB:#A98AF0; --secC:#45C38C; --secD:#F07272; --secL:#9AB6E0;
  --hint:#2A2614; --hintline:#6B5A23; --sel:#203252;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.app{display:grid;grid-template-columns:288px 1fr;height:100%}

/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 28px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px}
.brand .digi{font-size:24px;padding:4px 10px}
.brand h1{font-size:19px;line-height:1.3;margin:0}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.mode{display:flex;background:var(--paper);border-radius:12px;padding:4px;margin:2px 4px 8px}
.mode button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-size:15px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,40,70,.18)}
.prog{margin:8px 6px 4px;font-size:14px;color:var(--muted)}
.prog .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.grp{margin-top:16px}
.grp h2{font-size:15px;margin:0 6px 6px;display:flex;align-items:center;gap:8px}
.grp h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.grp h2 span{font-weight:400;color:var(--muted);font-size:13px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;min-height:46px;font-size:16px;line-height:1.35}
.item:hover{background:var(--paper)}
.item[aria-current="true"]{background:var(--sel);font-weight:700}
.item .no{flex:none;width:34px;font-family:"Barlow Condensed",sans-serif;font-size:18px;color:var(--c)}
.item .tt{flex:1}
.item .st{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.item .st.tried{border-color:var(--warn);background:var(--warnbg)}
.item .st.ok{border-color:var(--ok);background:var(--ok)}
.reset{margin:22px 6px 0;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted);min-height:40px}

/* ---------- main ---------- */
.scrim{display:none}
.main{min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:28px 28px 60px}
.topbar{display:none}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;color:var(--muted)}
.tag{display:inline-block;color:#fff;background:var(--c);border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px}
.card h2{margin:0 0 10px;font-size:26px;line-height:1.35}
.prompt{font-size:20px;margin:0 0 6px}
.prompt b{color:var(--ink)}
.fig{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;margin:16px 0 6px}
.fig svg{max-width:100%;height:auto}
.figcap{font-size:14px;color:var(--muted);text-align:center;margin-top:-4px}
.ans{margin:22px 0 4px;padding:18px 20px;background:var(--paper);border-radius:14px;font-size:21px;line-height:2.4}
.box{width:2.6em;height:1.9em;font:700 24px "Barlow Condensed","Noto Sans TC",sans-serif;text-align:center;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);vertical-align:middle;-webkit-appearance:none;appearance:none;padding:0}
.box:focus{border-color:var(--am);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--am) 25%,transparent)}
.box.ok,.seg.ok{border-color:var(--ok);background:var(--okbg)}
.box.bad,.seg.bad{border-color:var(--bad);background:var(--badbg)}
.box.pad{border-color:var(--warn);background:var(--warnbg)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;border:2px solid transparent;border-radius:12px;padding:2px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;min-width:48px;padding:0 14px;font-size:19px;line-height:1.2}
.opt[aria-pressed="true"]{border-color:var(--am);background:var(--sel);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:0 18px;font-size:17px;font-weight:500}
.btn.primary{background:var(--board);border-color:var(--board);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--am);border-color:var(--am);color:#0F1725}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--am);border-color:var(--am);color:#0F1725}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:0 16px;font-size:17px}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:var(--ok);padding:12px 16px;font-weight:700}
.fb.bad{background:var(--badbg);color:var(--bad);padding:12px 16px}
.fb.warn{background:var(--warnbg);color:var(--warn);padding:12px 16px}
.hints{margin-top:14px}
.hint{background:var(--hint);border:1px solid var(--hintline);border-radius:12px;padding:10px 16px;margin-top:8px;font-size:17px}
.hint b.k{display:inline-block;margin-right:8px;color:var(--warn)}
.sol{margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.sol h3{margin:0 0 8px;font-size:21px}
.sol ol{margin:8px 0 0;padding-left:1.5em}
.sol li{margin:6px 0}
.sol .final{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.lock{font-size:14px;color:var(--muted);align-self:center}

/* ---------- digital clock & tables ---------- */
.digi{display:inline-block;background:var(--board);color:var(--amber);font:700 34px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.06em;padding:8px 16px;border-radius:10px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.digi.big{font-size:64px;padding:10px 22px}
.dlabel{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tt{border-collapse:collapse;font-size:17px;min-width:320px}
.tt th,.tt td{border:1px solid var(--line);padding:8px 14px;text-align:center}
.tt th{background:var(--board);color:#fff;font-weight:500}
.tt td.t{font:700 22px "Barlow Condensed",sans-serif;letter-spacing:.04em}
.tt tr.hi td{background:var(--okbg)}
.note{font-size:15px;color:var(--muted);margin:4px 0 0}

/* ---------- svg parts ---------- */
.c-face{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.c-tk{stroke:var(--muted);stroke-width:1.5}
.c-tk5{stroke:var(--ink);stroke-width:3}
.c-num{fill:var(--ink);font:600 19px "Barlow Condensed",sans-serif;text-anchor:middle}
.c-h{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.c-m{stroke:var(--pm);stroke-width:4;stroke-linecap:round}
.c-pin{fill:var(--ink)}
.sv-t{fill:var(--ink);font:500 13px "Noto Sans TC",sans-serif;text-anchor:middle}
.sv-n{fill:var(--ink);font:700 17px "Barlow Condensed",sans-serif;text-anchor:middle}
.sv-m{fill:var(--muted);font:500 12px "Noto Sans TC",sans-serif;text-anchor:middle}
.sv-am{fill:var(--am)} .sv-pm{fill:var(--pm)}
.sv-axis{stroke:var(--ink);stroke-width:2.5}
.sv-tick{stroke:var(--ink);stroke-width:1.5}
.sv-arc{fill:none;stroke:var(--pm);stroke-width:2.5}
.sv-arc.b{stroke:var(--secB)}
.sv-head{fill:var(--pm)} .sv-head.b{fill:var(--secB)}
.sv-lab{fill:var(--pm);font:700 14px "Noto Sans TC",sans-serif;text-anchor:middle}
.sv-lab.b{fill:var(--secB)}
.sv-dot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.sv-pin{fill:var(--amber);stroke:var(--board);stroke-width:2}
.sv-pinlab{fill:var(--board)}
.sv-pintxt{fill:var(--amber);font:700 15px "Barlow Condensed",sans-serif;text-anchor:middle}
.pie-bg{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.pie-on{fill:color-mix(in srgb,var(--am) 55%,transparent);stroke:var(--ink);stroke-width:2}
.pie-off{fill:none;stroke:var(--ink);stroke-width:2}

/* ---------- start / duration / end strip ---------- */
.tri{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:center}
.tri-c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.tri-c .q{display:inline-flex;align-items:center;justify-content:center;width:112px;height:56px;border:3px dashed var(--pm);border-radius:10px;color:var(--pm);font:700 34px "Barlow Condensed",sans-serif}
.tri-ar{position:relative;min-width:160px;margin-bottom:22px;padding:0 10px 4px;text-align:center;color:var(--pm);font-weight:700;font-size:16px;border-bottom:3px solid var(--pm)}
.tri-ar.q{border-bottom-style:dashed}
.tri-ar::after{content:"";position:absolute;right:-12px;bottom:-9px;border:7px solid transparent;border-left:12px solid var(--pm)}
.how{display:grid;gap:14px;margin:14px 0}
.how>div{background:var(--paper);border-radius:14px;padding:16px}
.how h4{margin:0 0 8px;font-size:19px}
.step-lab{display:inline-block;min-width:4.2em;font-size:15px;font-weight:700;color:var(--secB)}
/* ---------- learn pages ---------- */
.explorer{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin:18px 0}
.ex-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.ex-lab{font-size:14px;color:var(--muted)}
.ex-12{font-size:30px;font-weight:700}
.ex-12 .ap{color:var(--am)} .ex-12 .ap.pm{color:var(--pm)}
.ex-rule{background:var(--paper);border-radius:12px;padding:10px 14px;font-size:17px}
input[type=range]{width:100%;height:44px;accent-color:var(--board);margin:8px 0}
.nudge{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rules{display:grid;gap:12px;margin:16px 0}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--paper);border-radius:14px;padding:14px 16px}
.rule .digi{font-size:26px}
.fr-row{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin:12px 0}
.fr-row figure{margin:0;text-align:center;font-size:18px}
h3.sub{font-size:20px;margin:26px 0 6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.85em;margin:0 2px}
.frac .de{border-top:2px solid currentColor;padding-top:1px}
mjx-container{display:inline-block!important;margin:0 2px!important}

/* ---------- responsive ---------- */
@media (max-width: 1000px){ .app{grid-template-columns:250px 1fr} .wrap{padding:22px 18px 50px} }
@media (max-width: 720px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:30;transform:translateX(-102%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .topbar button{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:44px;padding:0 14px;font-size:16px}
  .card{padding:20px 16px}
  .explorer{grid-template-columns:1fr;justify-items:center}
  .digi.big{font-size:52px}
  .ans{font-size:19px;padding:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="題目清單"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="mainScroll">
    <div class="topbar"><button type="button" id="menuBtn">☰ 題目清單</button><span id="topTitle"></span></div>
    <div class="wrap" id="main"></div>
  </main>
</div>

<script>
/* ===================== helpers ===================== */
const T=(h,m)=>h*60+m;
const p2=n=>String(n).padStart(2,'0');
const wrap=x=>((x%1440)+1440)%1440;
const f24=x=>{x=wrap(x);return p2(Math.floor(x/60))+':'+p2(x%60)};
const r1=n=>Math.round(n*10)/10;
const N=(a,pad)=>({t:'n',a,pad:!!pad});
const C=(o,a)=>({t:'c',o,a});

function digi(t,cls=''){return `<span class="digi ${cls}">${t}</span>`}
function dl(label,t){return `<div class="dlabel">${digi(t)}<span>${label}</span></div>`}

function clockSVG(h,m,size=190){
  let s=`<svg class="clock" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="鐘面">`;
  s+=`<circle cx="100" cy="100" r="93" class="c-face"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,ri=i%5?84:77;
    s+=`<line x1="${r1(100+ri*Math.sin(a))}" y1="${r1(100-ri*Math.cos(a))}" x2="${r1(100+89*Math.sin(a))}" y2="${r1(100-89*Math.cos(a))}" class="${i%5?'c-tk':'c-tk5'}"/>`}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;s+=`<text x="${r1(100+64*Math.sin(a))}" y="${r1(100-64*Math.cos(a)+7)}" class="c-num">${n}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  s+=`<line x1="100" y1="100" x2="${r1(100+44*Math.sin(ha))}" y2="${r1(100-44*Math.cos(ha))}" class="c-h"/>`;
  s+=`<line x1="100" y1="100" x2="${r1(100+70*Math.sin(ma))}" y2="${r1(100-70*Math.cos(ma))}" class="c-m"/>`;
  return s+`<circle cx="100" cy="100" r="6" class="c-pin"/></svg>`;
}

/* 0–24 day timeline: 12-hour labels above, 24-hour labels below */
function dayBar(marks=[]){
  const X=m=>30+m/1440*580;
  const top=['午夜12','上午3','上午6','上午9','正午12','下午3','下午6','下午9','午夜12'];
  let s=`<svg viewBox="0 0 640 132" width="640" role="img" aria-label="一天 24 小時時間線">
  <defs><linearGradient id="dg" x1="0" x2="1">
  <stop offset="0" stop-color="#22325A"/><stop offset=".23" stop-color="#46679C"/><stop offset=".33" stop-color="#9CCBF2"/>
  <stop offset=".5" stop-color="#FFE28E"/><stop offset=".7" stop-color="#FFB36B"/><stop offset=".8" stop-color="#6A5596"/><stop offset="1" stop-color="#22325A"/></linearGradient></defs>
  <text x="168" y="16" class="sv-m">上午</text><text x="472" y="16" class="sv-m">下午</text>
  
  <rect x="30" y="46" width="580" height="22" rx="11" fill="url(#dg)"/>`;
  for(let i=0;i<=8;i++){const x=X(i*180);
    s+=`<line x1="${x}" y1="42" x2="${x}" y2="72" class="sv-tick"/>`;
    s+=`<text x="${x}" y="36" class="sv-t ${i<4?'sv-am':(i<8?'sv-pm':'sv-am')}">${top[i]}</text>`;
    s+=`<text x="${x}" y="92" class="sv-n">${p2(i*3)}:00</text>`}
  marks.forEach(mk=>{const x=X(mk.m);
    s+=`<path d="M${x} 72 l-7 -14 h14 z" class="sv-pin"/>`;
    s+=`<rect x="${x-34}" y="100" width="68" height="26" rx="7" class="sv-pinlab"/>`;
    s+=`<line x1="${x}" y1="72" x2="${x}" y2="100" class="sv-tick"/>`;
    s+=`<text x="${x}" y="119" class="sv-pintxt">${mk.l||f24(mk.m)}</text>`});
  return s+`</svg>`;
}

/* jump diagram on a time line: forward (orange) or backward (purple) */
function jumpSVG(start,steps,back=false,labels){
  const pts=[start];steps.forEach(st=>pts.push(pts[pts.length-1]+(back?-st.d:st.d)));
  const n=steps.length,L=60,R=580,seg=(R-L)/n;
  const xs=pts.map((_,i)=>back?R-i*seg:L+i*seg);
  const b=back?' b':'';
  let s=`<svg viewBox="0 0 640 150" width="640" role="img" aria-label="時間線圖解">`;
  s+=`<line x1="24" y1="100" x2="616" y2="100" class="sv-axis"/><path d="M616 100 l-10 -6 v12 z" class="sv-head" style="fill:var(--ink)"/>`;
  steps.forEach((st,i)=>{
    const x1=xs[i],x2=xs[i+1],cx=(x1+x2)/2;
    s+=`<path d="M${x1} 94 Q${cx} 30 ${x2} 94" class="sv-arc${b}"/>`;
    const dx=x2-cx,dy=94-30,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
    s+=`<path d="M${x2} 94 L${r1(x2-12*ux-6*uy)} ${r1(94-12*uy+6*ux)} L${r1(x2-12*ux+6*uy)} ${r1(94-12*uy-6*ux)} z" class="sv-head${b}"/>`;
    s+=`<text x="${cx}" y="54" class="sv-lab${b}">${st.l}</text>`;
  });
  pts.forEach((p,i)=>{
    s+=`<circle cx="${xs[i]}" cy="100" r="6" class="sv-dot"/>`;
    s+=`<text x="${xs[i]}" y="126" class="sv-n">${labels&&labels[i]?labels[i]:f24(p)}</text>`;
    if(i===0) s+=`<text x="${xs[i]}" y="145" class="sv-m">${back?'由這裏往回數':'由這裏開始'}</text>`;
  });
  return s+`</svg>`;
}

/* fraction of an hour as a clock-pie */
function pieSVG(num,den,size=130){
  const c=60,r=52;let s=`<svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="${num}/${den} 小時">`;
  s+=`<circle cx="${c}" cy="${c}" r="${r}" class="pie-bg"/>`;
  for(let i=0;i<den;i++){
    const a0=i/den*2*Math.PI,a1=(i+1)/den*2*Math.PI;
    const x0=r1(c+r*Math.sin(a0)),y0=r1(c-r*Math.cos(a0)),x1=r1(c+r*Math.sin(a1)),y1=r1(c-r*Math.cos(a1));
    s+=`<path d="M${c} ${c} L${x0} ${y0} A${r} ${r} 0 ${1/den>.5?1:0} 1 ${x1} ${y1} Z" class="${i<num?'pie-on':'pie-off'}"/>`;
    const am=(a0+a1)/2;s+=`<text x="${r1(c+32*Math.sin(am))}" y="${r1(c-32*Math.cos(am)+5)}" class="sv-m" style="fill:var(--ink)">${60/den}分</text>`;
  }
  return s+`</svg>`;
}

function tbl(head,rows,hi=-1){
  return `<div class="tbl-wrap"><table class="tt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map((r,i)=>`<tr class="${i===hi?'hi':''}">${r.map(c=>/^\d\d:\d\d$/.test(c)?`<td class="t">${c}</td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

];

const KEY='p3-24h-tool-v2';
let S={cur:'L1',mode:'student',prog:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
const mem={}; // per question: {vals:[], hint:0, tries:0, sol:false, fb:null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function M(id){return mem[id]||(mem[id]={vals:[],hint:0,tries:0,sol:false,fb:null,marks:[]})}

/* ===================== sidebar ===================== */
const $=s=>document.querySelector(s);
function renderSide(){
  const qs=Q.filter(q=>!q.learn),done=qs.filter(q=>S.prog[q.id]==='ok').length;
  let h=`<div class="brand">${digi('24:00')}<h1>24 小時報時制<small>小三・時間</small></h1></div>
  <div class="mode" role="group" aria-label="使用模式">
   <button type="button" data-mode="student" aria-pressed="${S.mode==='student'}">學生模式</button>
   <button type="button" data-mode="teacher" aria-pressed="${S.mode==='teacher'}">老師模式</button></div>
  <div class="prog">已答對 ${done} / ${qs.length} 題<div class="bar"><i style="width:${done/qs.length*100}%"></i></div></div>`;
  for(const k in SECS){const sec=SECS[k];
    h+=`<div class="grp" style="--c:var(${sec.c})"><h2>${sec.name}<span>${sec.note}</span></h2>`;
    Q.filter(q=>q.s===k).forEach(q=>{
      const st=S.prog[q.id]||'';
      h+=`<button type="button" class="item" data-id="${q.id}" aria-current="${q.id===S.cur}"><span class="no">${q.id}</span><span class="tt">${q.n}</span>${q.learn?'':`<span class="st ${st}" aria-label="${st==='ok'?'已答對':st==='tried'?'已嘗試':'未做'}"></span>`}</button>`});
    h+=`</div>`}
  h+=`<button type="button" class="reset" id="resetBtn">重設所有進度</button>`;
  $('#side').innerHTML=h;
  typeset($('#side'));
}
$('#side').addEventListener('click',e=>{
  const it=e.target.closest('.item');if(it){go(it.dataset.id);closeMenu();return}
  const md=e.target.closest('[data-mode]');if(md){S.mode=md.dataset.mode;save();render();return}
  if(e.target.id==='resetBtn'&&confirm('確定重設所有進度？')){S.prog={};for(const k in mem)delete mem[k];save();render()}
});
function openMenu(){$('#side').classList.add('open');$('#scrim').classList.add('open')}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
$('#menuBtn').onclick=openMenu;$('#scrim').onclick=closeMenu;

function go(id){S.cur=id;save();render();$('#mainScroll').scrollTop=0;window.scrollTo(0,0)}

/* ===================== learn pages ===================== */
let exMin=T(15,15);
function twelve(x){const h=Math.floor(x/60),m=x%60;
  if(h===0&&m===0)return['','午夜 12 時'];if(h===12&&m===0)return['','正午 12 時'];
  const ap=h<12?'上午':'下午';let hh=h%12;if(hh===0)hh=12;return[ap,`${hh} 時${m?` ${m} 分`:''}`]}
function ruleText(x){const h=Math.floor(x/60);
  if(h===0)return '午夜 12 時是新一天的開始，記作 <b>00</b> 時。';
  if(h<12)return `上午：時數不變，${h<10?`補 0 寫成 <b>${p2(h)}</b>`:`寫成 <b>${h}</b>`}。`;
  if(h===12)return '正午 12 時至 12 時 59 分：時數仍是 <b>12</b>，不用加 12。';
  return `下午：${h-12} + 12 = <b>${h}</b>`}
function learnExplorer(){
  return `<div class="crumb"><span class="tag" style="--c:var(--secL)">學習區</span>L1</div>
  <div class="card"><h2>一天有 24 小時</h2>
  <p class="prompt">拉動下面的時間軸，看看同一個時間，用兩種報時制怎樣寫。</p>
  <div class="explorer"><div id="exClock"></div>
   <div><div class="ex-row"><span class="ex-lab">12 小時報時制</span><span class="ex-12" id="ex12"></span></div>
   <div class="ex-row"><span class="ex-lab">24 小時報時制</span><span id="ex24"></span></div>
   <div class="ex-rule" id="exRule"></div></div></div>
  <div class="fig" id="exBar"></div>
  <input type="range" id="exRange" min="0" max="1435" step="5" value="${exMin}" aria-label="選擇時間">
  <div class="nudge">
   <button class="btn" data-d="-60">− 1 小時</button><button class="btn" data-d="-5">− 5 分</button>
   <button class="btn" data-d="5">+ 5 分</button><button class="btn" data-d="60">+ 1 小時</button></div>
  <h3 class="sub">記住</h3>
  <ul><li>24 小時報時制<b>無須</b>標示「上午」、「下午」、a.m. 或 p.m.。</li>
  <li>時和分<b>各用兩個數位</b>，例如 7:05 a.m. 寫成 07:05。</li>
  <li>正午 12 時記作 12:00；午夜 12 時記作 00:00。</li></ul>
  </div>${pager()}`;
}
function updExplorer(){
  const [ap,rest]=twelve(exMin);const h=Math.floor(exMin/60),m=exMin%60;
  $('#exClock').innerHTML=clockSVG(h,m,200);
  $('#ex12').innerHTML=`${ap?`<span class="ap ${ap==='下午'?'pm':''}">${ap}</span> `:''}${rest}`;
  $('#ex24').innerHTML=digi(f24(exMin),'big');
  $('#exRule').innerHTML=ruleText(exMin);
  $('#exBar').innerHTML=dayBar([{m:exMin}]);
  $('#exRange').value=exMin;
}
function learnRules(){
  return `<div class="crumb"><span class="tag" style="--c:var(--secL)">學習區</span>L2</div>
  <div class="card"><h2>轉換方法與時間計算</h2>
  <h3 class="sub">12 小時 → 24 小時</h3>
  <div class="rules">
   <div class="rule">${digi('07:05')}<div>上午 7 時 5 分：時數不變，<b>補 0</b> 成兩個數位。</div></div>
   <div class="rule">${digi('12:30')}<div>下午 12 時 30 分：正午的 12 時<b>不用加 12</b>。</div></div>
   <div class="rule">${digi('19:07')}<div>下午 7 時 7 分：下午 1 時至 11 時，時數 <b>+ 12</b>（7 + 12 = 19）。</div></div>
   <div class="rule">${digi('00:00')}<div>午夜 12 時：一天的開始，記作 00:00，讀作「0 時 0 分」。</div></div>
  </div>
  <h3 class="sub">24 小時 → 12 小時</h3>
  <p>時數大於 12 的，<b>減 12</b> 再加上「下午」：21:40 → 21 − 12 = 9 → 下午 9 時 40 分。</p>
  <h3 class="sub">計算經過的時間：跳整點</h3>
  <p>由 09:40 到 12:15 經過了多久？先跳到下一個整點，再跳整小時，最後跳剩下的分鐘。</p>
  <div class="fig">${jumpSVG(T(9,40),[{d:20,l:'20 分'},{d:120,l:'2 小時'},{d:15,l:'15 分'}])}</div>
  <p>20 分鐘 + 2 小時 + 15 分鐘 = <b>2 小時 35 分鐘</b>。</p>
  <h3 class="sub">已知結束時間，找開始時間：往回跳</h3>
  <div class="fig">${jumpSVG(T(14,25),[{d:60,l:'− 1 小時'},{d:25,l:'− 25 分'},{d:10,l:'− 10 分'}],true)}</div>
  <p>14:25 往回 1 小時 35 分鐘：先回 1 小時到 13:25，再回 25 分鐘到 13:00，最後回 10 分鐘到 <b>12:50</b>。</p>
  <h3 class="sub">跨越午夜</h3>
  <p>過了 23:59 便回到 00:00。計算時先數到 00:00，再由 00:00 繼續數。</p>
  <div class="fig">${jumpSVG(T(23,20),[{d:40,l:'40 分'},{d:90,l:'1 小時 30 分'}],false,['23:20','00:00','01:30'])}</div>
  <p>23:20 再過 2 小時 10 分鐘：先數 40 分鐘到 00:00，再數 1 小時 30 分鐘到 <b>01:30</b>（第二天）。</p>
  </div>${pager()}`;
}

function learnTypes(){
  return `<div class="crumb"><span class="tag" style="--c:var(--secL)">學習區</span>L3</div>
  <div class="card"><h2>三種時間題：知二求一</h2>
  <p class="prompt">開始時間、經過時間、結束時間，知道其中兩個，就可以求第三個。</p>
  <div class="how">
   <div><h4>① 求經過時間</h4>${tri('09:40','?','12:15')}<p>由開始時間<b>向前數</b>：先數到下一個整點，再數整小時，最後數剩下的分鐘。</p><div class="fig">${jumpSVG(T(9,40),[{d:20,l:'20 分'},{d:120,l:'2 小時'},{d:15,l:'15 分'}])}</div><p>20 分 + 2 小時 + 15 分 = <b>2 小時 35 分鐘</b></p></div>
   <div><h4>② 求結束時間</h4>${tri('14:35','1 小時 40 分鐘','?')}<p>開始時間<b>加上</b>經過時間：先加小時，再加分鐘；分鐘超過 60 時，先湊成整點。</p><div class="fig">${jumpSVG(T(14,35),[{d:60,l:'+ 1 小時'},{d:25,l:'+ 25 分'},{d:15,l:'+ 15 分'}])}</div><p>14:35 → 15:35 → 16:00 → <b>16:15</b></p></div>
   <div><h4>③ 求開始時間</h4>${tri('?','2 小時 50 分鐘','11:20')}<p>由結束時間<b>往回數</b>：先減小時，再減分鐘；不夠減時，先退到整點。</p><div class="fig">${jumpSVG(T(11,20),[{d:120,l:'− 2 小時'},{d:20,l:'− 20 分'},{d:30,l:'− 30 分'}],true)}</div><p>11:20 → 09:20 → 09:00 → <b>08:30</b></p></div>
  </div>
  <p class="note">小貼士：做完可以驗算。例如 08:30 + 2 小時 50 分鐘 = 11:20 ✓</p>
  </div>${pager()}`;
}
/* ===================== question page ===================== */
function fieldHTML(f,i,m){
  const mk=m.marks[i]||'';
  if(f.t==='n')return `<input class="box ${mk}" data-i="${i}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="方格 ${i+1}" value="${m.vals[i]??''}">`;
  return `<span class="seg ${mk}" data-i="${i}" role="group" aria-label="選擇 ${i+1}">${f.o.map(o=>`<button type="button" class="opt" data-v="${o}" aria-pressed="${m.vals[i]===o}">${o}</button>`).join('')}</span>`;
}
function pager(){
  const i=Q.findIndex(q=>q.id===S.cur),pv=Q[i-1],nx=Q[i+1];
  return `<nav class="pager">${pv?`<button class="btn" data-go="${pv.id}">← ${pv.id}</button>`:'<span></span>'}${nx?`<button class="btn" data-go="${nx.id}">${nx.id} →</button>`:'<span></span>'}</nav>`;
}
function qPage(q){
  const m=M(q.id),sec=SECS[q.s],idx=Q.filter(x=>x.s===q.s).indexOf(q)+1;
  const canSol=S.mode==='teacher'||m.tries>0||S.prog[q.id]==='ok';
  let h=`<div class="crumb"><span class="tag" style="--c:var(${sec.c})">${sec.name}</span>第 ${idx} 題（${q.id}）</div><div class="card">`;
  h+=`<p class="prompt">${q.q}</p>`;
  if(q.fig)h+=`<div class="fig">${q.fig()}</div>`;
  h+=`<div class="ans" id="ans">${q.tpl.replace(/(?<![}a-z])\{(\d+)\}/g,(_,i)=>fieldHTML(q.f[+i],+i,m))}</div>`;
  h+=`<div class="actions">
    <button type="button" class="btn primary" id="chk">檢查答案</button>
    <button type="button" class="btn" id="hnt" ${m.hint>=q.hints.length?'disabled':''}>提示（${m.hint}/${q.hints.length}）</button>
    <button type="button" class="btn" id="sl" ${canSol?'':'disabled'}>${m.sol?'收起題解':'題解及圖解'}</button>
    <button type="button" class="btn" id="clr">重做</button>
    ${canSol?'':'<span class="lock">先試答一次，題解便會開放。</span>'}</div>`;
  h+=`<div class="fb ${m.fb?m.fb[0]:''}" id="fb" role="status" aria-live="polite">${m.fb?m.fb[1]:''}</div>`;
  h+=`<div class="hints">${q.hints.slice(0,m.hint).map((t,i)=>`<div class="hint"><b class="k">提示 ${i+1}</b>${t}</div>`).join('')}</div>`;
  if(m.sol){h+=`<div class="sol"><h3>題解</h3>${q.sol.fig?`<div class="fig">${q.sol.fig()}</div>`:''}<ol>${q.sol.steps.map(s=>`<li>${s}</li>`).join('')}</ol><span class="final">答案：${q.sol.ans}</span></div>`}
  h+=`</div>${pager()}`;
  return h;
}
function readVals(q){
  const m=M(q.id);
  document.querySelectorAll('#ans input.box').forEach(el=>{m.vals[+el.dataset.i]=el.value.trim()});
}
function check(q){
  readVals(q);const m=M(q.id);
  let empty=0,bad=0,pad=0;
  m.marks=q.f.map((f,i)=>{const v=m.vals[i];
    if(v===undefined||v==='')return(empty++,'');
    if(f.t==='c')return v===f.a?'ok':(bad++,'bad');
    if(!/^\d+$/.test(v)||+v!==f.a)return(bad++,'bad');
    if(f.pad&&v.length<2)return(pad++,'pad');
    return 'ok'});
  if(empty){m.fb=['warn',`還有 ${empty} 個空格未填。`]}
  else if(bad){m.tries++;m.fb=['bad',`有 ${bad} 格不正確（紅色）。${m.hint<q.hints.length?'按「提示」一步一步想。':'看看提示，或打開題解。'}`];if(S.prog[q.id]!=='ok')S.prog[q.id]='tried'}
  else if(pad){m.tries++;m.fb=['warn','數值對了！不過 24 小時報時制的時和分要<b>各用兩個數位</b>，例如 7 要寫成 07。'];if(S.prog[q.id]!=='ok')S.prog[q.id]='tried'}
  else{m.tries++;m.fb=['ok','答對了！做得好。'];S.prog[q.id]='ok'}
  save();render();
  if(m.fb[0]==='ok'){const i=Q.findIndex(x=>x.id===q.id),nx=Q[i+1];if(nx){const fb=$('#fb');fb.innerHTML+=` <button type="button" class="btn go" data-go="${nx.id}" style="margin-left:10px">下一題</button>`}}
}

/* ===================== render ===================== */
function render(){
  const q=Q.find(x=>x.id===S.cur)||Q[0];S.cur=q.id;
  renderSide();
  $('#topTitle').textContent=`${q.id}　${q.n.replace(/\$[^$]*\$/g,'').trim()}`;
  const main=$('#main');
  if(q.learn==='explorer'){main.innerHTML=learnExplorer();updExplorer();
    $('#exRange').oninput=e=>{exMin=+e.target.value;updExplorer()};
    main.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{exMin=wrap(exMin+ +b.dataset.d);if(exMin>1435)exMin=1435;updExplorer()});
  } else if(q.learn==='rules'){main.innerHTML=learnRules()}
  else if(q.learn==='types'){main.innerHTML=learnTypes()}
  else{main.innerHTML=qPage(q);bindQ(q)}
  typeset(main);
}
function bindQ(q){
  const m=M(q.id),inputs=[...document.querySelectorAll('#ans input.box')];
  inputs.forEach((el,k)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');m.vals[+el.dataset.i]=el.value;el.classList.remove('ok','bad','pad');m.marks[+el.dataset.i]='';
      if(el.value.length===2&&inputs[k+1])inputs[k+1].focus()});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(q)}});
  });
  document.querySelectorAll('#ans .seg').forEach(sg=>sg.addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b)return;readVals(q);m.vals[+sg.dataset.i]=b.dataset.v;m.marks[+sg.dataset.i]='';
    sg.classList.remove('ok','bad');sg.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b))}));
  $('#chk').onclick=()=>check(q);
  $('#hnt').onclick=()=>{readVals(q);if(m.hint<q.hints.length)m.hint++;render()};
  $('#sl').onclick=()=>{readVals(q);m.sol=!m.sol;render();if(m.sol){const el=document.querySelector('.sol');el&&el.scrollIntoView({behavior:'smooth',block:'start'})}};
  $('#clr').onclick=()=>{mem[q.id]={vals:[],hint:0,tries:m.tries,sol:false,fb:null,marks:[]};render()};
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});

/* ===================== math rendering ===================== */
function fracFallback(el){
  const walk=n=>{
    if(n.nodeType===3&&n.nodeValue.includes('$')){
      const html=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\$(\d*)\\frac\{(\d+)\}\{(\d+)\}\$/g,(_,w,a,b)=>`${w}<span class="frac"><span>${a}</span><span class="de">${b}</span></span>`);
      const sp=document.createElement('span');sp.innerHTML=html;n.replaceWith(sp);
    } else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='svg')[...n.childNodes].forEach(walk);
  };walk(el);
}
let mjq=Promise.resolve();
function typeset(el){
  if(window.mjReady&&window.MathJax&&MathJax.typesetPromise){mjq=mjq.then(()=>MathJax.typesetPromise([el])).catch(()=>fracFallback(el))}
  else fracFallback(el);
}
window.render=render;
render();
</script>
</body>
